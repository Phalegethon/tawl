name: Published Homebrew end-to-end test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to test, without v (0.2.0 or newer)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      PUBLISHED_TAG: ${{ github.event.release.tag_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Homebrew
        run: brew update
      - name: Fresh install, live terminal and both upgrade paths
        id: exercise
        shell: bash
        run: bash scripts/homebrew-e2e.sh
      - name: Save installation and terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-e2e-${{ matrix.architecture }}
          path: ${{ runner.temp }}/tawl-homebrew-e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the runner installation
        # On failure/cancellation a timed-out brew descendant may still be
        # running. Let hosted-runner teardown clean that isolated machine.
        if: always() && steps.exercise.outcome == 'success'
        shell: bash
        run: |
          if brew list --formula phalegethon/tawl/tawl >/dev/null 2>&1; then
            brew uninstall phalegethon/tawl/tawl
          fi
          brew untap phalegethon/tawl || true
